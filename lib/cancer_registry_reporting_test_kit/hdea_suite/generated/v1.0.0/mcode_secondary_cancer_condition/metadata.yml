:name: mcode_secondary_cancer_condition
:resource: Condition
:profile_url: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-secondary-cancer-condition
:profile_name: Secondary Cancer Condition Profile
:profile_version: 4.0.0
:title: Condition Secondary Cancer
:short_description: Verify support for the server capabilities required by the Secondary
  Cancer Condition Profile.
:must_supports:
  :extensions: []
  :slices:
    - :slice_id: Condition.extension:assertedDate
      :slice_name: assertedDate
      :path: extension
      :discriminator:
        :type: value
        :path: url
      :values:
        - :system: ""
          :code: http://hl7.org/fhir/StructureDefinition/condition-assertedDate :contentReference[oaicite:2]{index=2}

    - :slice_id: Condition.extension:histologyMorphologyBehavior
      :slice_name: histologyMorphologyBehavior
      :path: extension
      :discriminator:
        :type: value
        :path: url
      :values:
        - :system: ""
          :code: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-histology-morphology-behavior :contentReference[oaicite:3]{index=3}

    - :slice_id: Condition.extension:relatedPrimaryCancerCondition
      :slice_name: relatedPrimaryCancerCondition
      :path: extension
      :discriminator:
        :type: value
        :path: url
      :values:
        - :system: ""
          :code: http://hl7.org/fhir/StructureDefinition/condition-related :contentReference[oaicite:4]{index=4}

    - :slice_id: Condition.extension:locationQualifier
      :slice_name: locationQualifier
      :path: extension
      :discriminator:
        :type: value
        :path: url
      :values:
        - :system: ""
          :code: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-body-location-qualifier :contentReference[oaicite:5]{index=5}

    - :slice_id: Condition.extension:lateralityQualifier
      :slice_name: lateralityQualifier
      :path: extension
      :discriminator:
        :type: value
        :path: url
      :values:
        - :system: ""
          :code: http://hl7.org/fhir/us/mcode/StructureDefinition/mcode-laterality-qualifier :contentReference[oaicite:6]{index=6}

    - :slice_id: Condition.category:us-core
      :slice_name: us-core
      :path: category
      :discriminator:
        :type: value
        :path: "$this"

    - :slice_id: Condition.category:screening-assessment
      :slice_name: screening-assessment
      :path: category
      :discriminator:
        :type: value
        :path: "$this"

  :elements:
    - :path: extension
    - :path: clinicalStatus
    - :path: verificationStatus
    - :path: category
    - :path: category:us-core
    - :path: category:screening-assessment
    - :path: code
    - :path: bodySite
    - :path: subject
    - :path: onsetDateTime
      :original_path: onset[x]
    - :path: abatementDateTime
      :original_path: abatement[x]
    - :path: recordedDate

:mandatory_elements:
  - Condition.code
  - Condition.subject
  - Condition.extension:relatedPrimaryCancerCondition.value[x]
  - Condition.extension:relatedPrimaryCancerCondition.url
  - Condition.category
  - Condition.category:us-core
